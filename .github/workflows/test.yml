name: Test

# Thêm 08/2026 — trước đây repo có sẵn 54 test (tests/, chạy qua
# `pytest`, DB được mock hoàn toàn nên KHÔNG cần Postgres thật để chạy
# — xem tests/conftest.py) nhưng KHÔNG có workflow nào chạy chúng.
# Render tự deploy khi có push lên nhánh chính (theo dõi trực tiếp qua
# Render Dashboard, không qua GitHub Actions trong repo này) — nghĩa là
# trước đây code sai vẫn lên production được miễn là push thành công,
# test suite chỉ chạy tay khi ai đó nhớ chạy trước khi push.
#
# Workflow này KHÔNG tự deploy gì (Render vẫn tự lo phần đó như cũ) —
# chỉ chạy test trên mỗi push/PR để lộ rõ trạng thái pass/fail ngay
# trên GitHub, làm cơ sở để bật "Require status checks to pass" ở
# Branch protection rule sau này nếu muốn chặn hẳn merge/push khi test
# đỏ (chưa bật sẵn ở đây — cần quyền admin repo để cấu hình, ngoài
# phạm vi 1 file workflow).
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres thật cho tests/test_pg_integration.py (thêm 09/2026). Các
    # test còn lại mock DB nên KHÔNG bắt được lỗi nằm ở chính câu SQL
    # (vd `uuid = text` làm GET /companies/partnership-signals trả 500).
    # Tên database có chữ "test" là bắt buộc — fixture của file test đó
    # DROP SCHEMA public CASCADE nên từ chối chạy nếu tên không chứa "test".
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scrapjd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài dependency (app + test + mypy)
        # requirements-dev.txt gồm `-r requirements.txt` (app + pytest, pytest-cov) cộng mypy và stubs đã ghim
        # phiên bản, nên một lệnh là đủ. Trước 10/2026 repo CHƯA có requirements-dev.txt (dòng
        # `pip install -r requirements-dev.txt` cũ từng làm job fail ngay bước cài đặt, nên đã bỏ); file được
        # tạo lại ở bước bật mypy (M1) với nội dung khác hẳn, chỉ chứa công cụ kiểm kiểu. Render vẫn chỉ đọc
        # requirements.txt nên không cài mypy lúc deploy.
        run: pip install -r requirements-dev.txt

      - name: Cài ruff (linter)
        # Thêm 08/2026 cùng đợt rà soát khả năng mở rộng — trước đây
        # không có bước lint tự động nào, lỗi kiểu tham chiếu biến không
        # tồn tại (xem commit xoá dead code ở scrapjd/db/companies.py, phát hiện
        # NHỜ chạy ruff lần đầu) chỉ lộ ra khi có người tình cờ đọc đúng
        # dòng code đó. Cấu hình rule ở ruff.toml (chỉ bật F + E9, xem
        # comment trong file đó lý do chưa bật E/W style).
        run: pip install ruff

      - name: Chạy ruff
        run: ruff check .

      - name: Chạy mypy (kiểm kiểu)
        # CHẶN: có lỗi kiểu là job đỏ. Cấu hình ở pyproject.toml, mục [tool.mypy]; phiên bản mypy và stubs ghim ở
        # requirements-dev.txt. Đặt trước pytest vì chạy nhanh và không cần DB, lỗi kiểu thì dừng sớm. Lưu ý: kết
        # quả còn phụ thuộc phiên bản các thư viện app chưa ghim (bs4, curl_cffi, starlette, slowapi, fastapi...), nên
        # bản mới của chúng có thể làm bước này đỏ dù code không đổi; cách xử lý gốc là lockfile (E11 trong kế hoạch).
        run: mypy

      - name: Chạy test
        # JWT_SECRET_KEY: scrapjd/api/security.py raise RuntimeError ngay lúc
        # import nếu thiếu biến này (xem .env.example) — giá trị dưới
        # đây chỉ để test chạy được, KHÔNG phải secret thật, không dùng
        # để ký token nào ngoài phạm vi CI run này. mock_conn (xem
        # tests/conftest.py) khiến DB thật KHÔNG bao giờ được gọi.
        env:
          JWT_SECRET_KEY: ci_placeholder_jwt_secret_not_used_in_production
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/scrapjd_test
        # --cov: đo độ phủ (cấu hình ở pyproject.toml, mục [tool.coverage.*]). Chỉ đo và in ra, chưa có
        # ngưỡng chặn (fail_under), nên không làm job đỏ vì số phần trăm.
        run: pytest --cov --cov-report=term-missing:skip-covered

      - name: Ghi bảng coverage vào trang tóm tắt của lượt chạy
        # Bảng markdown hiện ngay trên trang Actions của lượt chạy, khỏi phải mở log. Dùng lệnh có sẵn của
        # `coverage` nên không thêm action bên thứ ba nào (repo public, xem mục 9 trong kế hoạch).
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
