# Khai báo package để import `scrapjd` (và sau này mypy, import-linter) cùng cấu hình coverage. Thư viện phụ thuộc vẫn nằm ở
# requirements.txt (Render build bằng `pip install -r requirements.txt`, không đọc file này). Cấu hình ruff ở ruff.toml.
[project]
name = "scrapjd"
version = "0.0.0"
description = "Scrap JD backend"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["scrapjd*"]

# Coverage (đo test chạy qua bao nhiêu dòng code). CHỈ ĐO, không chặn gì: chưa đặt `fail_under`, và `pytest` thường
# không tự đo (phải thêm `--cov`, xem README mục "Chạy test"). Đo cả nhánh rẽ (branch), nên số thấp hơn đo theo dòng.
[tool.coverage.run]
branch = true
# Đo từ gốc repo để file nào chưa từng được import (0%) cũng hiện trong báo cáo, thay vì biến mất khỏi số tổng.
source = ["."]
omit = [
    "tests/*",  # code test không tính vào độ phủ của code chính
    "tools/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]

# mypy (kiểm kiểu). Mức chung: `strict = true` cho cả repo (M2 và M3 xong: mọi hàm phải có type hint, dict/list/tuple/set trần
# phải có tham số kiểu, `# type: ignore` và `cast` thừa bị báo); hàm thiếu hint hay dict trần mới ở bất kỳ file nào thì CI đỏ.
# CI chạy `mypy` ở .github/workflows/test.yml và CHẶN khi có lỗi.
# Chạy từ gốc repo: `mypy`. Phiên bản mypy và stubs ghim ở requirements-dev.txt.
[tool.mypy]
python_version = "3.12"
files = ["scrapjd", "scripts", "main.py"]
# M3k (xong): `strict = true` bật gộp 13 cờ của mypy (--disallow-any-generics, --disallow-subclassing-any,
# --disallow-untyped-calls, --disallow-untyped-defs, --disallow-incomplete-defs, --check-untyped-defs, --disallow-untyped-decorators,
# --warn-redundant-casts, --warn-unused-ignores, --warn-return-any, --no-implicit-reexport, --strict-equality, --extra-checks) cho cả
# repo, thay cho các cờ lẻ và 8 khối override `disallow_any_generics` (M3c đến M3j) trước đây. Danh sách này theo mypy ghim ở
# requirements-dev.txt; nâng mypy có thể thêm cờ mới vào `strict` và làm CI đỏ dù code không đổi, khi đó sửa hint cho khớp hoặc tạm
# ghim bản cũ. Ngoại lệ duy nhất còn lại là khối `ignore_missing_imports` bên dưới.
strict = true
no_implicit_optional = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
# Hai thư viện không có type hint kèm theo (không có py.typed, không có gói stubs chính thức).
module = ["apscheduler.*", "tavily.*"]
ignore_missing_imports = true
