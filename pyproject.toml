# Khai báo package để import `scrapjd` (và sau này mypy, import-linter) cùng cấu hình coverage. Thư viện phụ thuộc vẫn nằm ở
# requirements.txt (Render build bằng `pip install -r requirements.txt`, không đọc file này). Cấu hình ruff ở ruff.toml.
[project]
name = "scrapjd"
version = "0.0.0"
description = "Scrap JD backend"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["scrapjd*"]

# Coverage (đo test chạy qua bao nhiêu dòng code). CHỈ ĐO, không chặn gì: chưa đặt `fail_under`, và `pytest` thường
# không tự đo (phải thêm `--cov`, xem README mục "Chạy test"). Đo cả nhánh rẽ (branch), nên số thấp hơn đo theo dòng.
[tool.coverage.run]
branch = true
# Đo từ gốc repo để file nào chưa từng được import (0%) cũng hiện trong báo cáo, thay vì biến mất khỏi số tổng.
source = ["."]
omit = [
    "tests/*",  # code test không tính vào độ phủ của code chính
    "tools/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    'if __name__ == "__main__":',
    "if TYPE_CHECKING:",
]

# mypy (kiểm kiểu). Mức chung: kiểm cả hàm chưa có type hint và đã dọn sạch cảnh báo. Đang bật dần bắt buộc type hint (M2):
# module nào đã đủ hint thì thêm vào khối [[tool.mypy.overrides]] `disallow_untyped_defs` bên dưới; xong M2 sẽ bật cho cả repo.
# CI chạy `mypy` ở .github/workflows/test.yml và CHẶN khi có lỗi.
# Chạy từ gốc repo: `mypy`. Phiên bản mypy và stubs ghim ở requirements-dev.txt.
[tool.mypy]
python_version = "3.12"
files = ["scrapjd", "scripts", "main.py"]
check_untyped_defs = true   # kiểm cả thân hàm chưa có type hint (mặc định mypy bỏ qua)
warn_unused_ignores = true  # "# type: ignore" thừa thì báo, tránh ignore nằm lại sau khi lỗi đã hết
warn_redundant_casts = true
no_implicit_optional = true
warn_unused_configs = true
show_error_codes = true

[[tool.mypy.overrides]]
# Hai thư viện không có type hint kèm theo (không có py.typed, không có gói stubs chính thức).
module = ["apscheduler.*", "tavily.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# M2: các module đã gắn đủ type hint cho mọi hàm. Thiếu hint ở đây thì mypy báo lỗi (no-untyped-def). Thêm module vào
# danh sách này khi dọn xong; M2f gom thành cấu hình chung cho cả repo. Hiện có toàn bộ scrapjd/db/ (M2a, M2b), scrapjd/cli/,
# scrapjd/maintenance/, scrapjd/adapters/ và các module lẻ của scrapjd/ đã đủ hint (M2c nửa 1/2 và nửa 2/2), cùng scrapjd/api/ ngoài routers/ (M2d nửa 1/2 và nửa 2/2) và toàn bộ scrapjd/api/routers/ (M2e nửa 1/2 và nửa 2/2).
