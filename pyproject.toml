    "scrapjd.db.stats",
]
disallow_any_generics = true

[[tool.mypy.overrides]]
# M3d (xong): `disallow_any_generics` cho module lẻ của scrapjd/, scripts/ và main.py. Nửa 1/2: 6 module lá của scrapjd/ (`models`,
# `snapshots`, `pipeline_stats`, `normalize`, `field_stats`, `pipeline_db`) và 5 module vốn đã sạch (gói `scrapjd`, `config`, `constants`,
# `province_alias`, `sources_registry`). Nửa 2/2: `scrapjd.pipeline`, `main`, 2 script backfill và 1 script oneoff của scripts/ (cộng 3 gói
# `scripts` vốn đã sạch). M3e đến M3j thêm phần còn lại của repo; M3k xoá khối này và bật `strict = true`.
module = [
    "main",
    "scrapjd",
    "scrapjd.config",
    "scrapjd.constants",
    "scrapjd.field_stats",
    "scrapjd.models",
    "scrapjd.normalize",
    "scrapjd.pipeline",
    "scrapjd.pipeline_db",
    "scrapjd.pipeline_stats",
    "scrapjd.province_alias",
    "scrapjd.snapshots",
    "scrapjd.sources_registry",
