    "scrapjd.adapters.careerviet",
    "scrapjd.adapters.topcv",
    "scrapjd.adapters.vietnamworks",
    "scrapjd.adapters.vietnamworks_detail",
]
disallow_any_generics = true

[[tool.mypy.overrides]]
